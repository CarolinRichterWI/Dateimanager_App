name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Abhaengigkeiten installieren
        run: npm ci --omit=optional

      - name: Tests ausfuehren
        run: npm test

      - name: Web-App bauen
        run: npm run build

      - name: Capacitor synchronisieren
        run: npx cap sync android

      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: APK bauen
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: dateimanager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
